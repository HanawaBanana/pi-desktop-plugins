<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Agents Anywhere 远程助手</title>
  <style>
    :root {
      --bg: var(--pi-bg-subtle, #18181c);
      --card-bg: var(--pi-bg-panel, #222228);
      --text: var(--pi-text-main, #f0f0f4);
      --text-dim: var(--pi-text-muted, #9494a3);
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --status-ok: #10b981;
      --status-warn: #f59e0b;
      --border: var(--pi-border, #33333e);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 11px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .online { background: rgba(16, 185, 129, 0.15); color: var(--status-ok); }
    .online .dot { background: var(--status-ok); }
    .offline { background: rgba(245, 158, 11, 0.15); color: var(--status-warn); }
    .offline .dot { background: var(--status-warn); }
    .field { margin-top: 10px; }
    label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 7px 9px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      margin-top: 14px;
      width: 100%;
      transition: background 0.15s;
    }
    button:hover { background: var(--accent-hover); }
    .log-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      height: 120px;
      overflow-y: auto;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-all;
    }
    .tip {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 8px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🌐 远程互联</div>
    <div id="statusBadge" class="status-badge offline">
      <span class="dot"></span>
      <span id="statusText">离线</span>
    </div>
  </div>

  <div class="card">
    <span style="font-weight: 600; font-size: 12px;">配对与连接设置</span>
    <div class="field">
      <label for="serverUrl">服务端地址 (Server URL)</label>
      <input id="serverUrl" value="https://api.agents-anywhere.com" placeholder="https://..." />
    </div>
    <div class="field">
      <label for="connectorId">Connector ID</label>
      <input id="connectorId" placeholder="conn_xxxxxx" />
    </div>
    <div class="field">
      <label for="connectorToken">Connector Token (密钥)</label>
      <input id="connectorToken" type="password" placeholder="cxt_xxxxxx" />
    </div>
    <div class="field">
      <label for="deviceName">本地设备识别名</label>
      <input id="deviceName" value="My-Pi-Desktop" />
    </div>
    <button id="saveBtn">保存并立即连接</button>
    <div class="tip">
      💡 手机端操作：打开 Agents Anywhere App，在「设备」页面点击添加，将生成的 ID 与 Token 粘贴到上方即可完成配对。
    </div>
  </div>

  <div class="card">
    <span style="font-weight: 600; font-size: 12px;">实时运行日志</span>
    <div id="logContainer" class="log-box" style="margin-top: 8px;">[等待连接...]</div>
  </div>

  <script>
    async function updateStatus() {
      try {
        const res = await window.pi?.bus?.send('anywhere:get_status');
        if (!res) return;
        const connected = Boolean(res.connected);
        document.getElementById('statusText').innerText = connected ? '在线 (已连接)' : '已断开';
        document.getElementById('statusBadge').className = 'status-badge ' + (connected ? 'online' : 'offline');

        if (res.serverUrl) document.getElementById('serverUrl').value = res.serverUrl;
        if (res.connectorId && !document.getElementById('connectorId').matches(':focus')) {
          document.getElementById('connectorId').value = res.connectorId;
        }
        if (res.deviceName && !document.getElementById('deviceName').matches(':focus')) {
          document.getElementById('deviceName').value = res.deviceName;
        }

        if (Array.isArray(res.logs) && res.logs.length > 0) {
          document.getElementById('logContainer').innerText = res.logs.join('\n');
        }
      } catch (err) {}
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const config = {
        serverUrl: document.getElementById('serverUrl').value.trim(),
        connectorId: document.getElementById('connectorId').value.trim(),
        connectorToken: document.getElementById('connectorToken').value.trim(),
        deviceName: document.getElementById('deviceName').value.trim(),
      };
      await window.pi?.bus?.send('anywhere:save_config', config);
      setTimeout(updateStatus, 800);
    });

    setInterval(updateStatus, 4000);
    updateStatus();
  </script>
</body>
</html>
