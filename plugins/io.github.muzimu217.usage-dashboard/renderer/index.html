<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none'; form-action 'none'; base-uri 'none'"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    PI-Desktop owns exactly a 46px drag band and a minimal three-button
    window-control capsule. This panel uses pi-plugin-chrome=v3: the page can
    paint through the 46px band, while host-generated holes keep controls
    clickable and empty space draggable. Fixed or sticky panel surfaces use
    var(--pi-plugin-titlebar-height, 46px).
  -->
  <meta name="pi-plugin-chrome" content="v3" />
  <title>Usage Dashboard</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="toolbar" id="toolbar">
    <div class="toolbar-title" id="appTitle"></div>
    <div class="toolbar-actions">
      <div class="segmented" id="rangeSwitch" role="group"></div>
      <button type="button" class="icon-button" id="langBtn" aria-haspopup="false"></button>
      <button type="button" class="icon-button" id="themeBtn" aria-haspopup="false"></button>
      <button type="button" class="icon-button" id="refreshBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </svg>
      </button>
    </div>
  </header>

  <div class="statusline" id="statusLine" hidden></div>

  <main class="scroll" id="scroll">
    <div class="state" id="stateBox" hidden>
      <div class="state-title" id="stateTitle"></div>
      <div class="state-body" id="stateBody"></div>
      <div class="state-actions" id="stateActions"></div>
    </div>

    <div class="skeleton" id="skeleton" hidden aria-hidden="true">
      <div class="sk-row">
        <div class="sk sk-card"></div><div class="sk sk-card"></div>
        <div class="sk sk-card"></div><div class="sk sk-card"></div>
      </div>
      <div class="sk sk-block"></div>
      <div class="sk-row"><div class="sk sk-half"></div><div class="sk sk-half"></div></div>
      <div class="sk sk-block"></div>
    </div>

    <div id="content" hidden>
      <section class="cards" id="cards" aria-label="metrics">
        <div class="card">
          <div class="card-label" id="cardTotalLabel"></div>
          <div class="card-value" id="cardTotal">—</div>
          <div class="card-note" id="cardTotalNote"></div>
        </div>
        <div class="card">
          <div class="card-label" id="cardTurnsLabel"></div>
          <div class="card-value" id="cardTurns">—</div>
          <div class="card-note" id="cardTurnsNote"></div>
        </div>
        <div class="card">
          <div class="card-label" id="cardSessionsLabel"></div>
          <div class="card-value" id="cardSessions">—</div>
          <div class="card-note" id="cardSessionsNote"></div>
        </div>
        <div class="card">
          <div class="card-label" id="cardPeakLabel"></div>
          <div class="card-value" id="cardPeak">—</div>
          <div class="card-note" id="cardPeakNote"></div>
        </div>
      </section>

      <section class="block">
        <div class="block-head">
          <h2 id="heatTitle"></h2>
          <span class="block-note" id="streakNote"></span>
        </div>
        <div class="heat-wrap" id="heatHost"></div>
        <!-- Screen-reader twin of the heatmap: the same daily values as a table. -->
        <div class="sr-only" id="heatTableWrap"></div>
      </section>

      <div class="split">
        <section class="block">
          <div class="block-head">
            <h2 id="donutTitle"></h2>
            <span class="block-note" id="donutNote"></span>
          </div>
          <div class="donut-wrap" id="donutHost"></div>
        </section>

        <section class="block">
          <div class="block-head">
            <h2 id="trendTitle"></h2>
            <span class="block-note" id="trendNote"></span>
          </div>
          <div class="trend-legend" id="trendLegend" role="group"></div>
          <div class="trend-wrap" id="trendHost"></div>
          <!-- Screen-reader twin of the trend lines. -->
          <div class="sr-only" id="trendTableWrap"></div>
        </section>
      </div>

      <section class="block">
        <div class="block-head">
          <h2 id="sessionsTitle"></h2>
          <span class="block-note" id="sessionsNote"></span>
        </div>
        <div class="session-list" id="sessionList"></div>
      </section>

      <p class="diag" id="diagLine"></p>
    </div>
  </main>

  <footer class="provenance">
    <div id="provenanceLine"></div>
    <div class="disclaimer" id="disclaimerLine"></div>
  </footer>

  <!-- Same aggregation module the plugin process uses, loaded from the plugin root. -->
  <script src="../lib/aggregate.js"></script>
  <script src="panel.js"></script>
</body>
</html>
